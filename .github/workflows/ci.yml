name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v5

      - uses: echolang/setup-echo@v1

      - name: Install packages
        run: epm install

      - name: Build and test
        run: echoc test

      # libann-metal: on macOS the host-side tests, the GPU step skips under
      # the forking test runner. elsewhere only `available` is compiled
      - name: Install metal packages
        working-directory: metal
        run: epm install

      - name: Test metal
        working-directory: metal
        run: echoc test --package-dir vendor
